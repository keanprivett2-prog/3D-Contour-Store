<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | 3D Contour</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="logo">
            <h1>3D Contour</h1>
        </div>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="#">Custom Printing</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="header-actions">
            <button id="accountButton">Account</button>
            <button id="cartButton">Cart (0)</button>
        </div>

    </header>


    <main>

        <section class="cart-page">

            <div class="section-heading">
                <p>Your Order</p>
                <h2>Shopping Cart</h2>
            </div>


            <div class="cart-layout">

                <div class="cart-items" id="cartItems">

                    <!-- Cart items will be inserted here -->

                </div>


                <aside class="cart-summary">

                    <h3>Order Summary</h3>

                    <div class="summary-row">
                        <span>Items</span>
                        <span id="cartItemCount">0</span>
                    </div>

                    <div class="summary-row total-row">
                        <span>Total</span>
                        <span id="cartTotal">R0.00</span>
                    </div>

                    <button
                        class="checkout-button"
                        id="checkoutButton"
                    >
                        Proceed To Checkout
                    </button>

                    <a
                        href="shop.html"
                        class="continue-shopping"
                    >
                        Continue Shopping
                    </a>

                </aside>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div>
            <h3>3D Contour</h3>

            <p>
                Custom 3D printing and cake decorating products.
            </p>
        </div>

        <p>
            &copy; <span id="currentYear"></span> 3D Contour.
            All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

    <script src="maintenance.js"></script>

</body>

</html>

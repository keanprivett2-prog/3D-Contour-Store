<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Request Details | 3D Contour Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="logo">
            <h1>3D Contour Admin</h1>
        </div>

        <div class="header-actions">

            <button id="backToRequestsButton">
                Back To Requests
            </button>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </header>


    <main class="admin-dashboard">

        <section class="admin-dashboard-header">

            <p class="section-label">
                Custom Request
            </p>

            <h2>
                Request Details
            </h2>

            <p>
                Review the customer's request, inspiration image
                and design instructions.
            </p>

        </section>


        <section
            class="custom-request-details-card"
            id="customRequestDetails"
        >

            <p>
                Loading request...
            </p>

        </section>

    </main>


    <script
        type="module"
        src="admin-custom-request-details.js"
    ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Order Confirmation | 3D Contour
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo"
            >
                3D Contour
            </a>

            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="shop.html">
                    Shop
                </a>

                <button
                    id="cartButton"
                    type="button"
                >
                    Cart (0)
                </button>

            </nav>

        </div>

    </header>


    <main class="order-confirmation-page">

        <div class="order-confirmation-card">

            <div class="order-confirmation-icon">
                ✓
            </div>

            <h1>
                Thank You For Your Order
            </h1>

            <p>
                Your order has been received successfully.
            </p>

            <p>
                Your Order Number:
            </p>

            <strong
                id="orderNumber"
                class="order-confirmation-number"
            >
                Loading...
            </strong>

            <p class="order-confirmation-message">
                We will be in touch with you shortly regarding your order.
            </p>

            <a
                href="shop.html"
                class="order-confirmation-button"
            >
                Continue Shopping
            </a>

        </div>

    </main>


    <footer>

        <p>
            © <span id="currentYear"></span> 3D Contour
        </p>

    </footer>


    <script src="order-confirmation.js"></script>

</body>

</html>

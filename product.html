<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"

    <title>Product | 3D Contour</title>

    <link
        rel="stylesheet"
        href="style.css"

</head>

<body>

    <!-- =====================================
     Announcement Bar
====================================== -->

<div class="top-bar">

    <div class="top-bar-left">

        <span>
            🇿🇦 Proudly 3D Printed in South Africa
        </span>

    </div>


    <div class="top-bar-center">

        <span>
            Custom Designs • Made Just For You
        </span>

    </div>


    <div class="top-bar-right">

        <a href="faq.html">
            FAQ
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</div>


<!-- =====================================
     Main Store Header
====================================== -->

<header class="site-header">

    <div class="header-container">


        <!-- Logo -->

        <a
            href="store.html"
            class="logo"
        >

            <span class="logo-mark">
                3D
            </span>

            CONTOUR

        </a>


        <!-- Navigation -->

        <nav class="main-nav">

            <a href="store.html">
                Home
            </a>

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="cake-toppers.html">
                Cake Toppers
            </a>

            <a href="cookie-cutters.html">
                Cookie Cutters
            </a>

            <a href="stencils.html">
                Stencils
            </a>

            <a href="custom-printing.html">
                Custom Printing
            </a>

        </nav>


        <!-- Header Actions -->

        <div class="header-actions">

            <button
                id="accountButton"
                type="button"
            >
                Account
            </button>


            <button
                id="cartButton"
                type="button"
            >
                Cart (0)
            </button>

        </div>

    </div>

</header>


    <main class="product-details-page">

        <a
    href="shop.html"
    class="back-to-shop-link"
>
    ← Back to Shop
</a>

        <div
            class="product-details-container"
            id="productDetailsContainer"
        >

            <p>
                Loading product...
            </p>

        </div>

        <p>
            &copy;
            <span id="currentYear"></span>
            3D Contour. All rights reserved.
        </p>

    <script
        type="module"
        src="product.js"
    ></script>

    <script src="maintenance.js"></script>

</html>

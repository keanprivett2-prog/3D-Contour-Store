<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | 3D Contour</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <h1>3D Contour Admin</h1>

            <p>
                Sign in to manage products and store content.
            </p>


            <label for="adminEmail">
                Email Address
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="admin@example.com"
                autocomplete="email"
            >


            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                autocomplete="current-password"
            >


            <button id="adminLoginButton">
                Sign In
            </button>


            <p id="adminLoginMessage"></p>

        </div>

    </main>


    <script
        type="module"
        src="admin-login.js"
    ></script>
    

</body>

</html>
